<!doctype html>
<html lang="es">
<head>
{% include head.html %}
</head>
<body>
{% include nav.html %}
<main>
  <article class="post">
    <div class="wrap">
      <p class="eyebrow"><a href="{{ '/' | relative_url }}#blog">Blog</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d/%m/%Y" }}</time>{% if page.tema %} · {{ page.tema }}{% endif %}</p>
      <h1>{{ page.title }}</h1>
      {% if page.imagen %}<img class="post-img" src="{{ page.imagen | relative_url }}" alt="">{% endif %}
      <div class="prose post-body">
        {{ content }}
      </div>
      <p><a href="{{ '/' | relative_url }}#blog">← Volver al blog</a></p>
    </div>
  </article>
</main>
{% include footer.html %}
</body>
</html>
